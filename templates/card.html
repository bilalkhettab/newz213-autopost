<!doctype html>
<html lang="$lang" dir="$dir"><head><meta charset="utf-8"><title>Newz 213 card</title>
<style>
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Bold.ttf);font-weight:700}
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Regular.ttf);font-weight:400}
@font-face{font-family:'Kufi';src:url(assets/fonts/NotoKufiArabic-ExtraBold.ttf)}
@font-face{font-family:'Plex';src:url(assets/fonts/IBMPlexSansArabic-Medium.ttf)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#006233;color:#fff;font-family:'Archivo',sans-serif}
body.ar{font-family:'Plex',sans-serif}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:$focus}
.shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.88) 100%)}
.topshade{position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
body.nophoto .shade,body.nophoto .topshade{display:none}
.icon{position:absolute;top:56px;inset-inline-start:64px;width:132px;height:132px;border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
main{position:absolute;left:64px;right:64px;bottom:150px}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:30px}
.logo{height:84px;padding:0 22px;background:#fff;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);color:#111;font:700 28px/1 'Archivo',sans-serif}
.logo img{height:54px;max-width:280px;object-fit:contain}
.logo img.sq{height:52px;border-radius:10px}
.logo.ar{font-family:'Kufi';font-weight:400}
.logo.more{background:#006233;color:#fff;font-size:34px;direction:ltr;border:3px solid #fff}
h1{font-weight:700;font-size:78px;line-height:1.24;letter-spacing:-.01em}
h1 span{background:#fff;color:#111;padding:6px 22px 9px;border-radius:18px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.ar h1{font-family:'Kufi';font-weight:400;letter-spacing:0;line-height:1.7}
body.ar h1 span{padding:9px 22px 10px}
.sub{margin-top:30px;font-size:36px;line-height:1.38;color:#f2f2f2;text-shadow:0 2px 10px rgba(0,0,0,.4)}
body.ar .sub{line-height:1.6}
.foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#d8d8d8}
.foot .sec{display:flex;align-items:center;gap:14px}
.foot .sec b{background:#006233;color:#fff;padding:8px 16px;border-radius:8px;font-size:22px;letter-spacing:.04em}
body.nophoto .foot .sec b{background:#fff;color:#006233}
.foot .credit{font-size:20px;opacity:.85}
</style></head>
<body class="$lang $photo_class">
$photo_tag
<div class="topshade"></div><div class="shade"></div>
<img class="icon" src="assets/app-icon.png">
<main>
  <div class="logos">$logos</div>
  <h1 id="h"><span>$headline</span></h1>
  <div class="sub">$subline</div>
</main>
<div class="foot"><div class="sec"><b>$section</b><span>$date</span></div><div class="credit">$credit</div></div>
<script>
// Shrink the headline until the whole block sits below the icon.
const m=document.querySelector('main'), h=document.getElementById('h');
let s=parseFloat(getComputedStyle(h).fontSize);
while(m.getBoundingClientRect().top<250 && s>48){s-=4;h.style.fontSize=s+'px';}
</script>
</body></html>
