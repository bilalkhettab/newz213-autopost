<!doctype html>
<html lang="$lang" dir="$dir"><head><meta charset="utf-8"><title>Newz 213 card</title>
<style>
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Bold.ttf);font-weight:700}
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Regular.ttf);font-weight:400}
@font-face{font-family:'Kufi';src:url(assets/fonts/NotoKufiArabic-ExtraBold.ttf)}
@font-face{font-family:'Plex';src:url(assets/fonts/IBMPlexSansArabic-Medium.ttf)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#003a0b;color:#fff;font-family:'Archivo',sans-serif}
body.ar{font-family:'Plex',sans-serif}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:$focus}
.shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.88) 100%)}
.topshade{position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
body.nophoto .shade,body.nophoto .topshade{display:none}
.icon{position:absolute;top:56px;inset-inline-start:64px;width:132px;height:132px;border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
main{position:absolute;left:64px;right:64px;bottom:150px}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:32px}
.logo{height:84px;padding:0 22px;background:#fff;border-radius:999px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);color:#111;font:700 28px/1 'Archivo',sans-serif}
.logo img{height:54px;max-width:280px;object-fit:contain}
.logo img.sq{height:52px;border-radius:10px}
.logo.ar{font-family:'Kufi';font-weight:400}
.logo.more{background:#003a0b;color:#fff;font-size:34px;direction:ltr;border:3px solid #fff;width:84px;padding:0;justify-content:center}
h1{font-weight:700;font-size:72px;line-height:1.08;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
h1 .ln{background:#fff;color:#111;padding:2px 22px 8px;border-radius:18px;white-space:nowrap}
body.ar h1{font-family:'Kufi';font-weight:400;letter-spacing:0;line-height:1.3}
body.ar h1 .ln{padding:4px 30px 10px}
.sub{margin-top:32px;font-size:36px;line-height:1.38;color:#f2f2f2;text-shadow:0 2px 10px rgba(0,0,0,.4)}
body.ar .sub{line-height:1.6}
.foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#d8d8d8}
.foot .sec{display:flex;align-items:center;gap:14px}
.foot .sec b{background:#003a0b;color:#fff;padding:8px 16px;border-radius:8px;font-size:22px;letter-spacing:.04em}
body.nophoto .foot .sec b{background:#fff;color:#003a0b}
.foot .credit{font-size:20px;opacity:.85}
</style></head>
<body class="$lang $photo_class">
$photo_tag
<div class="topshade"></div><div class="shade"></div>
<img class="icon" src="assets/app-icon.png">
<main>
  <div class="logos">$logos</div>
  <h1 id="h">$headline</h1>
  <div class="sub">$subline</div>
</main>
<div class="foot"><div class="sec"><b>$section</b><span>$date</span></div><div class="credit">$credit</div></div>
<script>
// Split the headline into one pill per rendered line, then shrink until the block fits below the icon.
const m=document.querySelector('main'), h=document.getElementById('h');
const text=h.textContent.trim();
function layout(size){
  h.style.fontSize=size+'px'; h.style.display='block'; h.innerHTML='';
  const words=text.split(/\s+/).map(w=>{const s=document.createElement('span');s.textContent=w+' ';h.appendChild(s);return s;});
  const lines=[];let top=null;
  for(const w of words){const t=w.offsetTop; if(top===null||Math.abs(t-top)>4){lines.push([]);top=t;} lines[lines.length-1].push(w.textContent.trim());}
  h.innerHTML='';h.style.display='';
  for(const l of lines){const d=document.createElement('div');d.className='ln';d.textContent=l.join(' ');h.appendChild(d);}
}
document.fonts.ready.then(()=>{let s=72; layout(s);
while(m.getBoundingClientRect().top<250 && s>44){s-=4;layout(s);}});
</script>
</body></html>
