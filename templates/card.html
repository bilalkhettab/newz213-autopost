<!doctype html>
<html lang="$lang" dir="$dir"><head><meta charset="utf-8"><title>Newz 213 card</title>
<!-- Previous version: card.before.html (21 Nov 2026). -->
<style>
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Bold.ttf);font-weight:700}
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Medium.ttf);font-weight:500}
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Regular.ttf);font-weight:400}
@font-face{font-family:'Kufi';src:url(assets/fonts/NotoKufiArabic-ExtraBold.ttf)}
@font-face{font-family:'Plex';src:url(assets/fonts/IBMPlexSansArabic-Medium.ttf)}
:root{--ink:#111111;--paper:#F4F2EE;--green:#006233;--deep:#003a0b}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:var(--deep);color:#fff;font-family:'Archivo',sans-serif}
body.ar{font-family:'Plex',sans-serif}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:$focus}
/* Film grain on the photo only: hides web-JPEG blockiness, makes every feed photo feel like one print run. */
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;pointer-events:none;background:url(assets/grain.png) repeat;background-size:512px}
/* One shade, only as tall as the text that needs it (the headline carries its own white blocks). */
.shade{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,.84) 100%)}
body.nophoto .shade,body.nophoto .grain{display:none}

/* Masthead: icon + handle, top center (page watermark rule), always LTR. Inside the 3:4 grid crop. */
.mast{position:absolute;top:44px;left:50%;transform:translateX(-50%);direction:ltr;display:flex;align-items:center;gap:14px;
  height:80px;padding:0 30px 0 9px;background:var(--ink);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.mast img{width:62px;height:62px;border-radius:16px}
.mast span{font:700 32px/1 'Archivo',sans-serif;letter-spacing:-.01em;color:#fff}

main{position:absolute;left:64px;right:64px;bottom:136px}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px}
.logo{height:64px;padding:0 20px;background:#fff;border-radius:999px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.25);color:var(--ink);font:700 24px/1 'Archivo',sans-serif}
.logo img{height:40px;max-width:210px;object-fit:contain}
.logo img.sq{height:40px;border-radius:8px}
.logo.ar{font-family:'Kufi';font-weight:400}
.logo.more{background:var(--ink);color:#fff;font-size:26px;direction:ltr;width:64px;padding:0;justify-content:center}

h1{font-weight:700;font-size:72px;line-height:1.06;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
h1 .ln{background:#fff;color:var(--ink);padding:4px 20px 10px;border-radius:8px;white-space:nowrap}
body.ar h1{font-family:'Kufi';font-weight:400;letter-spacing:0;line-height:1.3}
body.ar h1 .ln{padding:2px 26px 12px}
.sub{margin-top:26px;max-width:900px;font-weight:500;font-size:34px;line-height:1.34;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.45)}
body.ar .sub{font-size:33px;line-height:1.6}

.foot{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center;font-size:25px;font-weight:500;color:rgba(255,255,255,.88)}
.foot .sec{display:flex;align-items:center;gap:16px}
.foot .sec b{background:var(--green);color:#fff;padding:9px 16px 10px;border-radius:6px;font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
body.ar .foot .sec b{letter-spacing:0;font-size:24px;padding:6px 16px 9px}
body.nophoto .foot .sec b{background:#fff;color:var(--green)}
.foot .credit{font-size:22px;opacity:.78}
</style></head>
<body class="$lang $photo_class">
$photo_tag
<div class="grain"></div><div class="shade"></div>
<div class="mast"><img src="assets/app-icon.png"><span>@newz.213</span></div>
<main>
  <div class="logos">$logos</div>
  <h1 id="h">$headline</h1>
  <div class="sub">$subline</div>
</main>
<div class="foot"><div class="sec"><b>$section</b><span>$date</span></div><div class="credit">$credit</div></div>
<script>
// One white block per rendered line, lines balanced (no one-word last line),
// then shrink until the text stack clears the masthead.
const m=document.querySelector('main'), h=document.getElementById('h');
// Never break inside "180 000", or after a short function word ("de", "à", "في", "من"…): glue with a no-break space.
const NB='\u00a0', AR=document.body.classList.contains('ar');
const GLUE=AR?['في','من','إلى','على','عن','مع','بعد','قبل','حتى','و']
             :['à','a','de','du','des','le','la','les','l’',"l'",'au','aux','en','et','un','une','sur','par','pour','dans','avec'];
let text=h.textContent.trim().replace(/\s+/g,' ').replace(/(\d) (?=\d{3}\b)/g,'$$1'+NB);
text=text.split(' ').reduce((acc,w)=>{const prev=acc[acc.length-1]; if(prev!==undefined && GLUE.includes(prev.split(NB).pop().toLowerCase())) acc[acc.length-1]=prev+NB+w; else acc.push(w); return acc;},[]).join(' ');
const words=text.split(' ');
const PAD=AR?52:40;   // .ln horizontal padding, both sides
function measure(width){
  h.style.display='block'; h.style.width=width+'px'; h.innerHTML='';
  const spans=words.map(w=>{const s=document.createElement('span');s.textContent=w+' ';h.appendChild(s);return s;});
  const lines=[];let top=null;
  for(const s of spans){const t=s.offsetTop; if(top===null||Math.abs(t-top)>4){lines.push([]);top=t;} lines[lines.length-1].push(s.textContent.trim());}
  return lines;
}
function layout(size){
  h.style.fontSize=size+'px';
  const full=m.clientWidth-PAD;
  let lines=measure(full);
  const n=lines.length;
  if(n>1){ // narrowest width that keeps the same line count = balanced rag
    let lo=full*0.45, hi=full;
    for(let i=0;i<14;i++){const mid=(lo+hi)/2; if(measure(mid).length>n) lo=mid; else hi=mid;}
    lines=measure(Math.ceil(hi)+1);
    if(lines.length>n) lines=measure(full);
  }
  h.innerHTML=''; h.style.display=''; h.style.width='';
  for(const l of lines){const d=document.createElement('div');d.className='ln';d.textContent=l.join(' ');h.appendChild(d);}
}
document.fonts.ready.then(()=>{let s=72; layout(s);
while(m.getBoundingClientRect().top<168 && s>44){s-=4;layout(s);}});
</script>
</body></html>
