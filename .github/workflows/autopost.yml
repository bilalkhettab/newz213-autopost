name: autopost
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the busy :00); the script decides whether to post
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the gap and active hours (the daily cap still applies)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post (at most one carousel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public
          DAILY_CAP: "10"
          MIN_OUTLETS: "2"
          # Algiers times. Peak hours: lunch and evening.
          POST_SLOTS: "12:30,13:15,14:00,18:30,19:15,20:00,20:45,21:30,22:15,23:00"
          SLOT_WINDOW_MIN: "40"
        run: python autopost.py ${{ inputs.force && '--force' || '' }}
