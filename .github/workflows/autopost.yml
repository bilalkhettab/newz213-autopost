name: autopost
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the busy :00); the script decides whether to post
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the gap and active hours (the daily cap still applies)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post (at most one carousel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public
          # Fill Meta's 100-a-day API limit (user, 21 Nov 2026). Meta's live quota is checked before each post.
          DAILY_CAP: "95"
          MIN_OUTLETS: "1"
          MAX_AGE_H: "24"
          MIN_GAP_MIN: "9"
          ACTIVE_FROM: "7"
          ACTIVE_TO: "1"
          QUOTA_MARGIN: "3"
          POST_SLOTS: ""
        run: python autopost.py ${{ inputs.force && '--force' || '' }}
