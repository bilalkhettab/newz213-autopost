name: autopost
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the busy :00); the script decides whether to post
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the gap and active hours (the daily cap still applies)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post (at most one carousel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public
          # 21 Nov 2026: ~6 posts/hour got the account blocked ("action is blocked", portfolio restricted
          # for automation). Keep it human-paced: a few posts a day at peak times, 2+ papers per story.
          DAILY_CAP: "5"
          MIN_OUTLETS: "2"
          MAX_AGE_H: "14"
          QUOTA_MARGIN: "3"
          POST_SLOTS: "12:45,18:30,20:00,21:15,22:30"
          SLOT_WINDOW_MIN: "40"
        run: python autopost.py ${{ inputs.force && '--force' || '' }}
